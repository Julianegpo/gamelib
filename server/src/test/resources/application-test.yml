# Used by integration tests (spring.profiles.active=test) — no Docker needed.
spring:
  datasource:
    url: jdbc:h2:mem:gamelibrary;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none   # Flyway owns the schema (same migrations as Postgres)

  flyway:
    enabled: true
